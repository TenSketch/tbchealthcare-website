{{ with .Params.why_us }}
<section class="why-us py-5">
  <div class="container">
    <h2 class="text-center section-heading mb-5">{{ .title }}</h2>
    <div class="row g-3">
      {{ range .items }}
      <div class="col-md-6 col-lg-3">
        <div class="why-card rounded-3 p-4 h-100 text-start">
          <i class="fas {{ .icon }} mb-2"></i>
          <p class="mb-0">{{ .text }}</p>
        </div>
      </div>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
